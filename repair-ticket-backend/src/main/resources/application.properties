spring.application.name=repair-ticket
server.port=${PORT:8082}

# ===================================================================
# CORS Configuration
# ===================================================================
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# ===================================================================
# PostgreSQL Database Configuration
# ===================================================================
# JDBC URL format: jdbc:postgresql://<host>:<port>/<database-name>
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/repair_ticket_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# HikariCP Connection Pool Configuration
# ===================================================================
# HikariCP is Spring Boot's default high-performance JDBC connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# ===================================================================
# JPA / Hibernate Configuration
# ===================================================================
# ddl-auto: 'update' automatically updates the schema to match Entities
spring.jpa.hibernate.ddl-auto=update

# SQL Logging & Formatting
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true

# Open Session In View (OSIV): Disabled to enforce proper transaction boundaries
spring.jpa.open-in-view=false

# ===================================================================
# JWT (JSON Web Token) Security Configuration
# ===================================================================
# 256-bit Secret Key for HMAC-SHA256 signing (Override in production via JWT_SECRET env var)
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# Expiration time in milliseconds: 86400000ms = 24 hours
app.jwt.expiration-milliseconds=${JWT_EXPIRATION_MS:86400000}

